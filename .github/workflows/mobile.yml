name: Mobile Build (iOS / Android)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --channel=0 --licenses > /dev/null || true
          "$SDKMANAGER" --channel=0 "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Capacitor
        run: |
          pnpm add -D @capacitor/cli
          pnpm add @capacitor/core @capacitor/android @capacitor/splash-screen @capacitor/status-bar @capacitor/app @capacitor/haptics @capacitor/keyboard

      - name: Build web
        run: pnpm build

      - name: Add Android platform
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
          pnpm exec cap copy android

      - name: Build APK
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x lint
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibebridge-android-apk
          path: web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-ios-simulator:
    name: Build iOS Simulator App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Capacitor
        run: |
          pnpm add -D @capacitor/cli
          pnpm add @capacitor/core @capacitor/ios @capacitor/splash-screen @capacitor/status-bar @capacitor/app @capacitor/haptics @capacitor/keyboard

      - name: Build web
        run: pnpm build

      - name: Add iOS platform
        run: |
          pnpm exec cap add ios
          pnpm exec cap sync ios
          pnpm exec cap copy ios

      - name: Build iOS Simulator App
        working-directory: web/ios
        run: |
          xcodebuild -project App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build
          mkdir -p App/build
          cp -r build/Build/Products/Debug-iphonesimulator/App.app App/build/VibeBridge-simulator.app

      - name: Zip simulator app
        run: |
          cd web/ios/App/build
          zip -r VibeBridge-iOS-Simulator.zip VibeBridge-simulator.app

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: vibebridge-ios-simulator
          path: web/ios/App/build/VibeBridge-iOS-Simulator.zip
          retention-days: 30
