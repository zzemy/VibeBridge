name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build web frontend
        run: pnpm --dir web build

      - name: Build Go agent sidecar (embedded web)
        run: go build -tags embed -trimpath -o app/src-tauri/binaries/vibebridge-agent-x86_64-pc-windows-msvc.exe ./cmd/vibebridge

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install app dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Build Tauri app
        working-directory: app
        run: pnpm tauri build
        env:
          NO_STRIP: 'true'

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: VibeBridge-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/src-tauri/target/release/bundle/nsis/*.exe
          draft: true
